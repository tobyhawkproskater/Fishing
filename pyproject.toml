[project]
name = "mcp-fishing"
version = "0.1.0"
description = "Knowledge base + (future) MCP server for PNW fishing reports"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1.2",
    "openpyxl>=3.1.5",
    "mcp>=1.2.0",
    "httpx>=0.27.0",
    # Windows ships no IANA tzdata; zoneinfo silently falls back to a fixed
    # -8 offset (wrong during PDT). Pin so sunrise/sunset stay accurate.
    "tzdata>=2024.1",
    # Pin: 47+ has no win-arm64 wheel and tries to build from Rust source.
    "cryptography>=46.0.3,<47",
]

[project.optional-dependencies]
dev = ["ruff>=0.6.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
