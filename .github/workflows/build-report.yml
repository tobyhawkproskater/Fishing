name: Build fishing report

on:
  schedule:
    # Off-peak minute (17) is more reliable than :00. GitHub queues scheduled
    # workflows behind on-demand jobs and frequently drops runs scheduled for
    # the top of the hour. Even so, expect occasional delays/skips.
    - cron: "17 * * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "src/fishing/**"
      - "kb/**"
      - ".github/workflows/build-report.yml"

permissions:
  contents: write

concurrency:
  group: build-report
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Render Pacific-time "today" so the 7-day window aligns with the
      # boat owner's local clock instead of UTC.
      TZ: "America/Los_Angeles"
      PYTHONIOENCODING: "utf-8"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Build reports into docs/
        run: |
          mkdir -p docs
          # Single process so desktop + mobile share one weather fetch
          # (otherwise the gust forecast can refresh between runs and the
          # two reports disagree on the gold PRIME marker).
          python -m fishing.build_reports docs/index.html docs/mobile.html

      - name: Commit and push if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # data/ holds the tide-prediction cache; persisting it keeps the
          # report buildable when NOAA CO-OPS is timing out on a later run.
          git add -A docs/ data/
          if git diff --staged --quiet; then
            echo "No changes."
          else
            git commit -m "Auto-rebuild fishing report ($(date -u +%Y-%m-%dT%H:%MZ))"
            git push
          fi
